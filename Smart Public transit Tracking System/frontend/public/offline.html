<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f97316">
    <title>You're offline | Smart Safar</title>
    <style>
      :root { color: #111827; background: #f8fafc; font-family: Arial, sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 390px); text-align: center; }
      img { width: 80px; height: 80px; border-radius: 20px; }
      h1 { margin: 24px 0 8px; font-size: 28px; }
      p { margin: 0; color: #64748b; font-size: 16px; line-height: 1.55; }
      small { display: block; margin-top: 16px; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/smart-transit-logo.svg" alt="Smart Safar">
      <h1>You're offline</h1>
      <p>Some Smart Safar features need an internet connection.</p>
      <small>Live buses, ETAs, bookings, alerts, and driver updates will be available when you reconnect.</small>
    </main>
  </body>
</html>
